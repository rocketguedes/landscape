# yaml-language-server: $schema=https://raw.githubusercontent.com/cncf/landscape2/refs/heads/main/docs/config/schema/settings.schema.json
foundation: CNCF

url: https://landscape.guedescloud.com.br

featured_items:
  - field: maturity
    options:
      - value: graduated
        order: 1
        label: CNCF Graduated
      - value: incubating
        order: 2
        label: CNCF Incubating
      - value: sandbox
        order: 3
        label: CNCF Sandbox

grid_items_size: medium

header:
  links:
    github: "https://github.com/rocketguedes/control-plane"
  logo: "images/logo_header.svg"

images:
  favicon: "https://cncf.github.io/landscape2-sites/cncf/favicon.png"
